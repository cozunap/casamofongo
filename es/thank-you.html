<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Shared Header -->
  <div id="header-placeholder"></div>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; background: radial-gradient(circle at center, #222222 0%, #111111 100%);">
    <div style="max-width: 650px; width: 100%; background: rgba(24, 24, 24, 0.95); border: 1px solid rgba(167, 13, 28, 0.4); border-radius: 8px; padding: 3.5rem 2.5rem; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 30px rgba(167, 13, 28, 0.25);">
      
      <!-- Checkmark Icon -->
      <div style="width: 80px; height: 80px; margin: 0 auto 1.75rem; border-radius: 50%; background: rgba(167, 13, 28, 0.15); border: 2px solid var(--color-primary); display: grid; place-items: center; color: #ffffff;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <span style="color: var(--color-accent-light); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; display: block; margin-bottom: 0.75rem;">
        Solicitud Recibida
      </span>

      <h1 style="color: #ffffff; font-size: clamp(2rem, 5vw, 2.75rem); font-weight: 900; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">
        ¡MUCHAS GRACIAS!
      </h1>

      <p style="color: #e0e0e0; font-size: 1.05rem; line-height: 1.7; margin-bottom: 1.75rem;">
        Tu solicitud ha sido recibida con éxito. Hemos enviado una copia de confirmación a tu correo electrónico y nuestro equipo revisará los detalles a la brevedad.
      </p>

      <div style="background: rgba(0, 0, 0, 0.35); border-radius: 6px; padding: 1.25rem 1rem; margin-bottom: 2rem; border: 1px solid rgba(255, 255, 255, 0.08);">
        <p style="color: #cccccc; font-size: 0.95rem; margin: 0;">
          Regresando a la página de inicio en <strong id="countdown-timer" style="color: var(--color-accent-light); font-size: 1.15rem;">5</strong> segundos...
        </p>
      </div>

      <a href="index.html" class="btn-primary" style="display: inline-block; padding: 0.9rem 2.5rem;">
        Volver al Inicio Ahora
      </a>
    </div>
  </main>

  <!-- Shared Footer -->
  <div id="footer-placeholder"></div>

  <script src="../js/components.js?v=9.6"></script>
  <script>
    (function() {
      let seconds = 5;
      const timerEl = document.getElementById('countdown-timer');
      const interval = setInterval(function() {
        seconds--;
        if (timerEl) {
          timerEl.textContent = seconds;
        }
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = 'index.html';
        }
      }, 1000);
    })();
  </script>
